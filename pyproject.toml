[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-timer"
version = "0.4.2"
description = "One-shot delayed messages to a live Codex CLI or desktop session"
requires-python = ">=3.9"
readme = "README.md"
dependencies = ["websocket-client>=1.8,<2", "psutil>=5.9,<8"]

[project.optional-dependencies]
test = ["pywinpty>=2,<3; sys_platform == 'win32'", "pexpect>=4,<5; sys_platform != 'win32'"]

[project.scripts]
codex-timer = "codex_timer:main"

[tool.setuptools]
py-modules = ["codex_timer"]
packages = ["codex_timer_assets"]
include-package-data = true

[tool.setuptools.package-data]
codex_timer_assets = ["skill/SKILL.md", "skill/agents/openai.yaml", "desktop_bridge.mjs"]
